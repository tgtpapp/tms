# Tạm thời: cài pdf.js (pdfjs-dist) vào web/ rồi đẩy package.json + package-lock.json. Xóa sau khi dùng.
name: Tam cai pdfjs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: web
        run: npm install --no-audit --no-fund --save-exact pdfjs-dist@5
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          git commit -m "Cài pdf.js (pdfjs-dist) để xem PDF ngay trong app"
          git push origin HEAD:main
