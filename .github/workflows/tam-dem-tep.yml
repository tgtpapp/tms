name: Tạm - kiểm tra chuyển tệp
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dem:
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGUSER: postgres.vnqkmaauqygnckgtshus
      PGDATABASE: postgres
      PGPORT: 5432
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - run: |
          for h in aws-1-ap-southeast-1.pooler.supabase.com aws-0-ap-southeast-1.pooler.supabase.com; do
            if PGHOST=$h psql -tAc 'select 1' >/dev/null 2>&1; then export PGHOST=$h; break; fi; done
          psql -P pager=off -c "select (drive_id is not null) as tren_drive, count(*), sum(move_fail) as loi, round(sum(size_bytes)/1048576.0,1) as mb from public.file_store group by 1;"
          psql -P pager=off -c "select count(*) as con_o_kho_cu from storage.objects where bucket_id = 'giay-to';"
          psql -P pager=off -c "select count(*) as kho_cu_chua_ghi from storage.objects o where bucket_id = 'giay-to' and not exists (select 1 from public.file_store f where f.name = o.name);"
          SQL="select timestamp, response.status_code as st, request.method as m from function_edge_logs cross join unnest(metadata) as metadata cross join unnest(metadata.response) as response cross join unnest(metadata.request) as request where function_id is not null and request.pathname like '%/tep%' order by timestamp desc limit 30"
          curl -sG "https://api.supabase.com/v1/projects/vnqkmaauqygnckgtshus/analytics/endpoints/logs.all" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --data-urlencode "sql=$SQL" --data-urlencode "iso_timestamp_start=$(date -u -d '-2 hours' +%Y-%m-%dT%H:%M:%SZ)" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(r.get('timestamp'), r.get('st'), r.get('m')) for r in d.get('result',[])] if 'result' in d else print(str(d)[:300])"
