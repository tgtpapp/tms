name: Chẩn đoán tạm (chỉ đọc, chỉ in số đếm)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chan-doan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: vnqkmaauqygnckgtshus
      SUPABASE_REGION: ap-southeast-1
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Kết nối
        run: |
          export PGUSER="postgres.${SUPABASE_PROJECT_REF}" PGDATABASE=postgres PGPORT=5432
          for host in "aws-1-${SUPABASE_REGION}.pooler.supabase.com" "aws-0-${SUPABASE_REGION}.pooler.supabase.com"; do
            if PGHOST="$host" psql -tAc 'select 1' >/dev/null 2>&1; then
              { echo "PGHOST=$host"; echo "PGUSER=$PGUSER"; echo "PGDATABASE=postgres"; echo "PGPORT=5432"; } >> "$GITHUB_ENV"; exit 0; fi
          done; exit 1
      - name: Số đếm (không in tên / số điện thoại)
        run: psql -v ON_ERROR_STOP=1 -f .github/scripts/chan_doan_tam.sql
      - name: Thời gian trả biểu tượng app (không in mã)
        run: |
          psql -tAc "select tenant_id || ' ' || split_part(split_part(name, '/anh_dai_dien/', 2), '.', 1) from public.file_store where name like '%/anh_dai_dien/%' limit 3" | while read t s; do
            for i in 1 2; do curl -s -o /tmp/i.png -w "lan $i: http %{http_code} %{content_type} %{size_download}B %{time_total}s\n" "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/app-install?t=$t&s=$s&z=192"; done
          done
