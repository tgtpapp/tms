name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Kiểm tra giao diện (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài thư viện
        run: npm install --no-audit --no-fund
      - name: Typecheck + build
        run: npm run check
      - name: Không để lộ khóa bí mật
        working-directory: .
        # Chỉ quét tệp trong kho (git grep), tìm đúng dạng khóa thật:
        # khóa bí mật Supabase, chuỗi kết nối Postgres có mật khẩu, JWT.
        run: |
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{10,}|postgres(ql)?://[^:/[:space:]]+:[^@[:space:]]+@|eyJhbGciOi[A-Za-z0-9_-]{20,}' ; then
            echo "Phát hiện khóa bí mật trong kho code" && exit 1
          fi
          echo "Không có khóa bí mật"

  db:
    name: Kiểm thử database (phân quyền, cách ly nhà xe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Khởi động Postgres của Supabase (chạy migration)
        run: supabase db start
      - name: Chạy lại toàn bộ migration từ đầu
        run: supabase db reset
      - name: Chạy kiểm thử pgTAP
        run: supabase test db
