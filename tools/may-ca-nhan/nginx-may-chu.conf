# Máy chủ dự phòng: 1 địa chỉ cho cả giao diện và hệ thống (Supabase trên máy, cổng 54321)
map $http_upgrade $conn { default upgrade; '' close; }
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 50m;
  location ~ ^/(auth|rest|functions|storage|realtime|graphql)/ {
    proxy_pass http://host.docker.internal:54321;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conn;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
  }
  location / { try_files $uri /index.html; }
}
