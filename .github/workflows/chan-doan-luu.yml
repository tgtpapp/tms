name: Chẩn đoán tốc độ lưu hồ sơ (tạm)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: vnqkmaauqygnckgtshus
      SUPABASE_REGION: ap-southeast-1
    steps:
      - name: Đo
        run: |
          export PGUSER="postgres.${SUPABASE_PROJECT_REF}" PGPASSWORD="$SUPABASE_DB_PASSWORD" PGDATABASE=postgres PGPORT=5432
          for host in "aws-1-${SUPABASE_REGION}.pooler.supabase.com" "aws-0-${SUPABASE_REGION}.pooler.supabase.com"; do
            if PGHOST="$host" psql -tAc 'select 1' >/dev/null 2>&1; then
              PGHOST="$host" psql -v ON_ERROR_STOP=1 <<'SQL'
          select count(*) filter (where drive_id is not null) co_ma, count(*) tong from public.archive_folders;
          select p.name loai, to_char(i.created_at at time zone 'Asia/Ho_Chi_Minh','HH24:MI') phut, count(*) so_tep,
                 round(avg(i.size)/1024) kb_tb, count(distinct date_trunc('second', i.created_at)) so_lan_ghi
          from public.archive_items i join public.archive_folders f on f.id=i.folder_id join public.archive_folders p on p.id=f.parent_id
          where i.created_at > now() - interval '5 hours'
          group by 1,2 order by 2,1;
          SQL
              exit 0
            fi
          done
          exit 1
