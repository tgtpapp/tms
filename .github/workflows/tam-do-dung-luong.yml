name: Tạm - thu gọn nhật ký
on: workflow_dispatch
permissions:
  contents: read
jobs:
  do:
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGUSER: postgres.vnqkmaauqygnckgtshus
      PGDATABASE: postgres
      PGPORT: 5432
    steps:
      - run: |
          for h in aws-1-ap-southeast-1.pooler.supabase.com aws-0-ap-southeast-1.pooler.supabase.com; do
            if PGHOST=$h psql -tAc 'select 1' >/dev/null 2>&1; then export PGHOST=$h; break; fi; done
          psql -P pager=off -c "select pg_size_pretty(pg_database_size(current_database())) as truoc, (select count(*) from public.audit_logs) as dong_nhat_ky;"
          psql -c "vacuum full public.audit_logs;"
          psql -P pager=off -c "select pg_size_pretty(pg_database_size(current_database())) as sau, pg_size_pretty(pg_total_relation_size('public.audit_logs')) as nhat_ky;"
