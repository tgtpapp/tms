name: Tạm - đếm giấy tờ xe không có ảnh
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dem:
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGUSER: postgres.vnqkmaauqygnckgtshus
      PGDATABASE: postgres
      PGPORT: 5432
    steps:
      - run: |
          for h in aws-1-ap-southeast-1.pooler.supabase.com aws-0-ap-southeast-1.pooler.supabase.com; do
            if PGHOST=$h psql -tAc 'select 1' >/dev/null 2>&1; then export PGHOST=$h; break; fi; done
          psql -P pager=off -c "select owner_kind, doc_type, count(*) filter (where coalesce(cardinality(files),0) = 0) as khong_anh, count(*) filter (where cardinality(files) > 0) as co_anh, count(*) filter (where cardinality(files) > 0 and exists (select 1 from unnest(files) f where not exists (select 1 from public.file_store s where s.name = f))) as anh_mat from public.documents where is_current group by 1,2 order by 1,2;"
