name: Tạm - chẩn đoán HĐLĐ thiếu thông tin (chỉ in số đếm)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: vnqkmaauqygnckgtshus
    steps:
      - run: |
          PW=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          for host in aws-1-ap-southeast-1.pooler.supabase.com aws-0-ap-southeast-1.pooler.supabase.com; do
            url="postgresql://postgres.${REF}:${PW}@${host}:5432/postgres"
            if psql "$url" -tAc 'select 1' >/dev/null 2>&1; then echo "::add-mask::$url"; break; fi
          done
          psql "$url" -P pager=off -c "
            select count(*) cccd_hien_tai,
                   count(*) filter (where issued_on is null) thieu_ngay_cap,
                   count(*) filter (where issued_on is null and coalesce(data->>'ngay_cap','') <> '') ngay_cap_nam_trong_data,
                   count(*) filter (where issuer is null) thieu_noi_cap
            from public.documents where doc_type='cccd' and is_current"
          psql "$url" -P pager=off -c "
            select count(*) nhan_vien,
                   count(*) filter (where m.phone is null) thieu_sdt,
                   count(*) filter (where p.staff_id is null) chua_co_ho_so_rieng,
                   count(*) filter (where p.current_address is null or p.current_address='') thieu_cho_o,
                   count(*) filter (where (p.current_address is null or p.current_address='') and p.address is not null) co_thuong_tru_thieu_cho_o
            from public.staff_members m left join public.staff_private p on p.tenant_id=m.tenant_id and p.staff_id=m.id where m.is_active"
          psql "$url" -P pager=off -c "select k, count(*) from public.documents d, jsonb_object_keys(d.data) k where d.doc_type='cccd' and d.is_current group by k order by k"
