name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Kiểm tra giao diện (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài thư viện
        run: npm install --no-audit --no-fund
      - name: Typecheck + build
        run: npm run check
      - name: Không để lộ khóa bí mật
        working-directory: .
        # Chỉ quét tệp trong kho (git grep), tìm đúng dạng khóa thật:
        # khóa bí mật Supabase, chuỗi kết nối Postgres có mật khẩu, JWT.
        run: |
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{10,}|postgres(ql)?://[^:/[:space:]]+:[^@[:space:]]+@|eyJhbGciOi[A-Za-z0-9_-]{20,}' -- . ':!.github/workflows/ci.yml' ; then
            echo "Phát hiện khóa bí mật trong kho code" && exit 1
          fi
          echo "Không có khóa bí mật"

  db:
    name: Kiểm thử database (phân quyền, cách ly nhà xe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Khởi động Postgres của Supabase
        run: supabase db start
      - name: Chạy lại toàn bộ migration từ đầu
        run: supabase db reset
      - name: Chạy kiểm thử pgTAP
        run: supabase test db

  e2e:
    name: Kiểm thử đầu-cuối (đăng nhập, tạo tài khoản)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Kiểm tra kiểu Edge Function
        run: deno check supabase/functions/admin-users/index.ts supabase/tests/e2e/admin_users.e2e.ts
      - name: Khởi động Supabase local
        run: supabase start -x studio,imgproxy,logflare,vector
      - name: Chạy Edge Function
        run: |
          nohup supabase functions serve > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/admin-users || true)
            [ "$code" = "200" ] && echo "Edge Function sẵn sàng" && exit 0
            sleep 2
          done
          cat functions.log; exit 1
      - name: Chạy kịch bản đầu-cuối
        run: |
          supabase status -o env > status.env
          set -a; . ./status.env; set +a
          deno run -A supabase/tests/e2e/admin_users.e2e.ts
      - name: Log Edge Function khi lỗi
        if: failure()
        run: cat functions.log || true

  deploy:
    name: Đưa database + Edge Function lên Supabase (bản chạy thật)
    needs: [web, db, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Mã project + vùng Supabase (công khai). Đổi máy chủ: sửa 2 dòng này.
      SUPABASE_PROJECT_REF: vnqkmaauqygnckgtshus
      SUPABASE_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Kiểm tra khóa bí mật đã khai báo
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Thiếu secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "Thiếu secret SUPABASE_DB_PASSWORD"; exit 1; }
      - name: Kết nối project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Tìm cổng kết nối IPv4 (Session pooler) của vùng
        run: |
          PW=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          for host in "aws-1-${SUPABASE_REGION}.pooler.supabase.com" "aws-0-${SUPABASE_REGION}.pooler.supabase.com"; do
            url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${PW}@${host}:5432/postgres"
            if psql "$url" -tAc 'select 1' >/dev/null 2>&1; then
              echo "::add-mask::$url"
              echo "SUPABASE_DB_URL=$url" >> "$GITHUB_ENV"
              echo "Dùng cổng: $host"
              exit 0
            fi
          done
          echo "Không kết nối được database qua Session pooler"; exit 1
      - name: Đưa migration mới lên (chỉ thêm, không xóa dữ liệu)
        run: supabase db push --remote="$SUPABASE_DB_URL" --yes
      - name: Đưa Edge Function lên
        run: supabase functions deploy admin-users --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
