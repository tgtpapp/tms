name: CI

on:
  push:
  pull_request:

# Phiên bản Supabase CLI cố định: không phải hỏi GitHub "bản mới nhất" (hay bị giới hạn lượt).
env:
  SUPABASE_CLI_VERSION: 3.2.0

jobs:
  web:
    name: Kiểm tra giao diện (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Cài thư viện
        run: npm install --no-audit --no-fund
      - name: Typecheck + build
        run: npm run check
      - name: Không để lộ khóa bí mật
        working-directory: .
        # Chỉ quét tệp trong kho (git grep), tìm đúng dạng khóa thật:
        # khóa bí mật Supabase, chuỗi kết nối Postgres có mật khẩu, JWT.
        run: |
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{10,}|postgres(ql)?://[^:/[:space:]]+:[^@[:space:]]+@|eyJhbGciOi[A-Za-z0-9_-]{20,}' -- . ':!.github/workflows/ci.yml' ; then
            echo "Phát hiện khóa bí mật trong kho code" && exit 1
          fi
          echo "Không có khóa bí mật"

  db:
    name: Kiểm thử database (phân quyền, cách ly nhà xe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase --version
      - name: Khởi động Postgres của Supabase
        run: .github/scripts/supabase-start.sh db
      - name: Chạy lại toàn bộ migration từ đầu
        run: supabase db reset
      - name: Chạy kiểm thử pgTAP
        run: supabase test db

  e2e:
    name: Kiểm thử đầu-cuối (đăng nhập, tạo tài khoản)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase --version
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Kiểm tra kiểu Edge Function
        run: deno check supabase/functions/admin-users/index.ts supabase/functions/doc-reader/index.ts supabase/tests/e2e/admin_users.e2e.ts
      - name: Danh mục giấy tờ ở giao diện và Edge Function phải giống hệt
        run: cmp supabase/functions/_shared/doc_types.ts web/src/lib/docTypes.ts
      - name: Kiểm thử AI đọc giấy tờ (fetch giả, không gọi AI thật)
        run: deno test supabase/tests/unit/
      - name: Khởi động Supabase local
        run: .github/scripts/supabase-start.sh full
      - name: Mô phỏng project thật (không tự cấp quyền service_role)
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB" -v ON_ERROR_STOP=1 -c "revoke all on all tables in schema public from service_role; revoke all on all sequences in schema public from service_role;"
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20261118150000_quyen_service_role.sql
      - name: Chạy Edge Function
        run: |
          nohup supabase functions serve > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/admin-users || true)
            [ "$code" = "200" ] && echo "Edge Function sẵn sàng" && exit 0
            sleep 2
          done
          cat functions.log; exit 1
      - name: Chạy kịch bản đầu-cuối
        run: |
          supabase status -o env > status.env
          set -a; . ./status.env; set +a
          deno run -A supabase/tests/e2e/admin_users.e2e.ts
      - name: Log Edge Function khi lỗi
        if: failure()
        run: cat functions.log || true

  ui:
    name: Kiểm thử giao diện trên trình duyệt (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Khởi động Supabase local
        run: .github/scripts/supabase-start.sh full
      - name: Mô phỏng project thật (không tự cấp quyền service_role)
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB" -v ON_ERROR_STOP=1 -c "revoke all on all tables in schema public from service_role; revoke all on all sequences in schema public from service_role;"
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20261118150000_quyen_service_role.sql
      - name: Chạy Edge Function
        run: |
          nohup supabase functions serve > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/admin-users || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          cat functions.log; exit 1
      - name: Nhớ trình duyệt Playwright giữa các lần chạy
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package.json') }}
      - name: Cài thư viện + trình duyệt
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build giao diện trỏ vào Supabase local
        working-directory: web
        run: |
          supabase status -o env > ../status.env
          set -a; . ../status.env; set +a
          VITE_APP_NAME=TMS VITE_APP_ENV=local VITE_TENANT_CODE=thinh-phat \
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          npx vite build --mode ci
      - name: Chạy kiểm thử giao diện
        working-directory: web
        run: npx playwright test
      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  deploy:
    name: Đưa database + Edge Function lên Supabase (bản chạy thật)
    needs: [web, db, e2e, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Mã project + vùng Supabase (công khai). Đổi máy chủ: sửa 2 dòng này.
      SUPABASE_PROJECT_REF: vnqkmaauqygnckgtshus
      SUPABASE_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase --version
      - name: Kiểm tra khóa bí mật đã khai báo
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Thiếu secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "Thiếu secret SUPABASE_DB_PASSWORD"; exit 1; }
      - name: Kết nối project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Tìm cổng kết nối IPv4 (Session pooler) của vùng
        run: |
          PW=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          for host in "aws-1-${SUPABASE_REGION}.pooler.supabase.com" "aws-0-${SUPABASE_REGION}.pooler.supabase.com"; do
            url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${PW}@${host}:5432/postgres"
            if psql "$url" -tAc 'select 1' >/dev/null 2>&1; then
              echo "::add-mask::$url"
              echo "SUPABASE_DB_URL=$url" >> "$GITHUB_ENV"
              echo "Dùng cổng: $host"
              exit 0
            fi
          done
          echo "Không kết nối được database qua Session pooler"; exit 1
      - name: Đưa migration mới lên (chỉ thêm, không xóa dữ liệu)
        run: supabase db push --remote="$SUPABASE_DB_URL" --yes
      - name: Khóa AI đọc giấy tờ (nếu khai báo ở GitHub thì chép sang Supabase)
        env:
          AI_PROVIDERS: ${{ secrets.AI_PROVIDERS }}
        run: |
          if [ -n "$AI_PROVIDERS" ]; then
            if supabase secrets set "AI_PROVIDERS=$AI_PROVIDERS" --yes >/dev/null 2>/tmp/err; then echo "Đã chép AI_PROVIDERS từ GitHub sang Supabase"
            else echo "::warning::Không chép được AI_PROVIDERS sang Supabase: $(grep -v "^Target:" /tmp/err | tr "\n" " " | head -c 400)"; fi
          else
            echo "GitHub không có secret AI_PROVIDERS (bỏ qua)"
          fi
      - name: Đưa Edge Function lên
        run: |
          supabase functions deploy admin-users --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy doc-reader --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
