name: Tạm - kiểm tra chuyển tệp
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dem:
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGUSER: postgres.vnqkmaauqygnckgtshus
      PGDATABASE: postgres
      PGPORT: 5432
    steps:
      - run: |
          for h in aws-1-ap-southeast-1.pooler.supabase.com aws-0-ap-southeast-1.pooler.supabase.com; do
            if PGHOST=$h psql -tAc 'select 1' >/dev/null 2>&1; then export PGHOST=$h; break; fi; done
          psql -P pager=off -c "select (drive_id is not null) as tren_drive, count(*), sum(move_fail) as loi, round(sum(size_bytes)/1048576.0,1) as mb from public.file_store group by 1;"
          psql -P pager=off -c "select count(*) as con_o_kho_cu from storage.objects where bucket_id = 'giay-to';"
          psql -P pager=off -c "select count(*) as kho_cu_chua_ghi from storage.objects o where bucket_id = 'giay-to' and not exists (select 1 from public.file_store f where f.name = o.name);"
