name: tam-kiem-tra
on: workflow_dispatch
jobs:
  k:
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGUSER: postgres.vnqkmaauqygnckgtshus
      PGDATABASE: postgres
      PGPORT: 5432
    steps:
      - run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - run: |
          for h in aws-1-ap-southeast-1.pooler.supabase.com aws-0-ap-southeast-1.pooler.supabase.com; do PGHOST=$h psql -tAc 'select 1' >/dev/null 2>&1 && { echo "PGHOST=$h" >> $GITHUB_ENV; break; }; done
      - run: |
          psql -Atc "select 'PSX0063: xe_co_trong_chuyen_cua_ai='||count(distinct c.staff_id) from public.repair_orders o left join public.trips t on t.tenant_id=o.tenant_id and t.vehicle_id=o.vehicle_id left join public.trip_crew c on c.tenant_id=t.tenant_id and c.trip_id=t.id where o.code='PSX0063'"
          i=0
          for u in $(psql -Atc "select id from public.app_users where status='active' order by created_at"); do
            i=$((i+1))
            psql -Atc "begin; set local role authenticated; select set_config('request.jwt.claims', json_build_object('sub','$u','role','authenticated')::text, true);
              select 'tai_khoan_$i: xem_tat_ca='||app.has_permission('repair.view_all')||' them='||app.has_permission('repair.add')||' chi_xe_minh='||(app.has_permission('repair.view') and not (app.has_permission('repair.view_all') or app.has_permission('repair.add') or app.has_permission('repair.edit') or app.has_permission('repair.delete')))
                ||' thay_phieu='||(select count(*) from public.repair_orders)||' thay_PSX0063='||(select count(*) from public.repair_orders where code='PSX0063')
                ||' so_xe_thay='||(select count(distinct vehicle_id) from public.repair_orders); rollback;" 2>&1 | grep -E "tai_khoan|ERROR"
          done
