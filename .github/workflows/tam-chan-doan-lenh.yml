name: Tạm - chẩn đoán tự điền lệnh (chỉ in số đếm / có-không)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: vnqkmaauqygnckgtshus
    steps:
      - run: |
          PW=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          for host in aws-1-ap-southeast-1.pooler.supabase.com aws-0-ap-southeast-1.pooler.supabase.com; do
            url="postgresql://postgres.${REF}:${PW}@${host}:5432/postgres"
            if psql "$url" -tAc 'select 1' >/dev/null 2>&1; then echo "::add-mask::$url"; break; fi
          done
          psql "$url" -P pager=off -c "select position('order_info_default' in pg_get_functiondef('public.transport_order_draft(uuid)'::regprocedure)) > 0 as draft_ok, position('''info''' in pg_get_functiondef('public.transport_order_print(uuid)'::regprocedure)) > 0 as print_ok"
          psql "$url" -P pager=off -c "
            select to_char(t.depart_at at time zone 'Asia/Ho_Chi_Minh','DD/MM HH24:MI') gio, t.status,
                   t.vehicle_id is not null co_xe,
                   (select count(*) from public.trip_crew c where c.tenant_id=t.tenant_id and c.trip_id=t.id and c.active) so_to_lai,
                   (select string_agg(c.role, ',') from public.trip_crew c where c.tenant_id=t.tenant_id and c.trip_id=t.id and c.active) vai,
                   (select string_agg(k, ',') from jsonb_object_keys(app.order_info_default(t.tenant_id, t.id)) k) info_co,
                   (select string_agg(k, ',') from public.transport_orders o, jsonb_object_keys(o.info) k where o.tenant_id=t.tenant_id and o.trip_id=t.id) info_lenh
            from public.trips t
            where t.service_date = (now() at time zone 'Asia/Ho_Chi_Minh')::date
              and (t.vehicle_id is not null or exists (select 1 from public.trip_crew c where c.tenant_id=t.tenant_id and c.trip_id=t.id))
            order by t.depart_at limit 60"
