name: Tạm - kiểm tra báo sự cố trên bản chạy thật
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          U=$(grep ^VITE_SUPABASE_URL= web/.env.production | cut -d= -f2- | tr -d '"'); K=$(grep ^VITE_SUPABASE_PUBLISHABLE_KEY= web/.env.production | cut -d= -f2- | tr -d '"')
          echo "OPTIONS: $(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$U/functions/v1/support")"
          echo "POST mã sai: $(curl -s -X POST "$U/functions/v1/support" -H "apikey: $K" -H 'content-type: application/json' -d '{"action":"login_report","code":"khong-ton-tai-zz","text":"kiem tra"}' -w ' %{http_code}')"
          js=$(curl -s https://thinhphat.pages.dev/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          echo "Giao diện có Báo sự cố: $(curl -s "https://thinhphat.pages.dev$js" | grep -c 'Báo sự cố')"
