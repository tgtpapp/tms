# Cấu hình Supabase CLI cho máy phát triển / CI (không chứa khóa bí mật).
project_id = "tms"

[db]
port = 54322
major_version = 17

# Hàm quản lý tài khoản tự kiểm tra phiên đăng nhập bên trong (gọi my_account_context)
[functions.admin-users]
verify_jwt = false

# AI đọc giấy tờ: tự kiểm tra phiên đăng nhập + quyền bên trong
[functions.doc-reader]
verify_jwt = false

# Zalo: Zalo gọi về không có phiên đăng nhập; POST tự kiểm tra phiên + quyền bên trong
[functions.zalo]
verify_jwt = false

# Lưu trữ hồ sơ trên Google Drive (Apps Script) của nhà xe: tự kiểm tra phiên + quyền bên trong
[functions.drive]
verify_jwt = false

[functions.app-install]
verify_jwt = false

# Thông báo đẩy: tự kiểm tra phiên bên trong (lấy khóa công khai không cần đăng nhập)
[functions.push]
verify_jwt = false

# Báo sự cố từ màn hình đăng nhập (chưa có phiên): chỉ lưu qua hàm nội bộ, có giới hạn số lần
[functions.support]
verify_jwt = false

# Lưu lệnh đã đóng dấu bằng mã QR trên lệnh (quét bằng Zalo, không cần đăng nhập; mã bí mật riêng từng lệnh)
[functions.lenh]
verify_jwt = false

[functions.tep]
verify_jwt = false

[functions.qr-login]
verify_jwt = false
