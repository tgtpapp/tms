name: tam-kiem-tra
on: workflow_dispatch
permissions:
  contents: read
jobs:
  k:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - run: |
          code=$(curl -s -o /tmp/a.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects/vnqkmaauqygnckgtshus/config/auth)
          echo "cfg http=$code so_khoa=$(jq 'keys|length' /tmp/a.json)"
          jq -r 'to_entries[] | select(.key|test("disable_signup|password_min|password_required|rate_limit|autoconfirm|external_email_enabled|external_phone_enabled|refresh_token|sessions_|captcha_enabled|captcha_provider|mfa_totp|mfa_phone|jwt_exp|site_url|security_update_password|manual_linking|anonymous")) | select(.key|test("secret|key")|not) | "cfg \(.key) = \(.value)"' /tmp/a.json
