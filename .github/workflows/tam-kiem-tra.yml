name: tam-kiem-tra
on: workflow_dispatch
jobs:
  k:
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGUSER: postgres.vnqkmaauqygnckgtshus
      PGDATABASE: postgres
      PGPORT: 5432
    steps:
      - run: sudo apt-get install -y -qq postgresql-client >/dev/null
      - run: |
          for h in aws-1-ap-southeast-1.pooler.supabase.com aws-0-ap-southeast-1.pooler.supabase.com; do PGHOST=$h psql -tAc 'select 1' >/dev/null 2>&1 && { echo "PGHOST=$h" >> $GITHUB_ENV; break; }; done
      - run: |
          psql -Atc "with o as (select * from public.repair_orders where code='PSX0063'),
            t as (select tr.id from public.trips tr, o where tr.tenant_id=o.tenant_id and tr.vehicle_id=o.vehicle_id and tr.status<>'huy' and tr.service_date between o.repaired_on-7 and o.repaired_on order by tr.service_date desc, tr.depart_at desc limit 1),
            c as (select c.staff_id, m.user_id from public.trip_crew c join t on t.id=c.trip_id join public.staff_members m on m.id=c.staff_id where c.role='lai_xe_1' and c.active)
            select 'lai_xe_co_chu_ky_nv='||exists(select 1 from storage.objects s, c where s.name like '%/chu_ky/nv_'||c.staff_id||'.png')
              ||' co_chu_ky_tai_khoan='||exists(select 1 from storage.objects s, c where c.user_id is not null and s.name like '%/chu_ky/'||c.user_id||'.png')
              ||' tong_chu_ky_luu='||(select count(*) from storage.objects where name like '%/chu_ky/%')"
