name: Chẩn đoán giấy tờ xếp xe (chỉ đọc)
on:
  workflow_dispatch:
jobs:
  doc:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: vnqkmaauqygnckgtshus
      SUPABASE_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4
      - name: Chạy truy vấn chỉ đọc
        run: |
          PW=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          for host in "aws-1-${SUPABASE_REGION}.pooler.supabase.com" "aws-0-${SUPABASE_REGION}.pooler.supabase.com"; do
            url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${PW}@${host}:5432/postgres"
            echo "::add-mask::$url"
            if psql "$url" -tAc 'select 1' >/dev/null 2>&1; then psql "$url" -v ON_ERROR_STOP=1 -f scripts/chan_doan_giay_to.sql; exit 0; fi
          done
          echo "Không kết nối được"; exit 1
