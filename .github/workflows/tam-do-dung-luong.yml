name: Tạm - đo dung lượng database
on: workflow_dispatch
permissions:
  contents: read
jobs:
  do:
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGUSER: postgres.vnqkmaauqygnckgtshus
      PGDATABASE: postgres
      PGPORT: 5432
    steps:
      - run: |
          for h in aws-1-ap-southeast-1.pooler.supabase.com aws-0-ap-southeast-1.pooler.supabase.com; do
            if PGHOST=$h psql -tAc 'select 1' >/dev/null 2>&1; then export PGHOST=$h; break; fi; done
          psql -P pager=off -c "select pg_size_pretty(pg_database_size(current_database())) as tong;"
          psql -P pager=off -c "select n.nspname as schema, pg_size_pretty(sum(pg_total_relation_size(c.oid))) as dung_luong from pg_class c join pg_namespace n on n.oid = c.relnamespace where c.relkind in ('r','m') group by 1 order by sum(pg_total_relation_size(c.oid)) desc limit 12;"
          psql -P pager=off -c "select n.nspname || '.' || c.relname as bang, pg_size_pretty(pg_total_relation_size(c.oid)) as dung_luong, c.reltuples::bigint as so_dong from pg_class c join pg_namespace n on n.oid = c.relnamespace where c.relkind = 'r' order by pg_total_relation_size(c.oid) desc limit 25;"
