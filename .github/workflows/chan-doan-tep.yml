name: Chẩn đoán tệp / ảnh (chỉ đọc)
on:
  workflow_dispatch:
# Chỉ đọc database và đọc thử 1 tệp trên Drive; nhật ký chỉ in số đếm và lời báo lỗi (không in tên, mã, địa chỉ, khóa)
permissions:
  contents: read

jobs:
  tep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: vnqkmaauqygnckgtshus
      SUPABASE_REGION: ap-southeast-1
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Gọi thử Edge Function tep (không đăng nhập) – xem hàm có chạy không
        run: |
          key=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' <(curl -sS "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/web/.env.production") | cut -d= -f2-)
          for f in tep drive; do
            code=$(curl -sS -o r.txt -w '%{http_code}' --max-time 60 -X POST -H "apikey: $key" -H 'Content-Type: application/json' -d '{"action":"get_many","names":[]}' "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/$f")
            echo "$f: HTTP $code · $(head -c 200 r.txt)"
          done
      - name: Nhật ký Edge Function 24 giờ qua (mã trạng thái + lỗi, không in nội dung)
        run: |
          q() { curl -sS --max-time 60 -G -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/analytics/endpoints/logs.all" \
                  --data-urlencode "sql=$1" --data-urlencode "iso_timestamp_start=$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ)" --data-urlencode "iso_timestamp_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; }
          echo "== Số lần gọi theo hàm / mã trạng thái"
          q "select regexp_extract(r.pathname, '/functions/v1/([^/?]+)') as fn, resp.status_code as st, count(*) as n
             from function_edge_logs cross join unnest(metadata) as m cross join unnest(m.request) as r cross join unnest(m.response) as resp
             group by fn, st order by fn, st" | jq -c '.result[]?, .error?' | head -40
          echo "== Lỗi trong hàm (50 dòng gần nhất, cắt 200 ký tự)"
          q "select format_timestamp('%d/%m %H:%M', timestamp, 'Asia/Ho_Chi_Minh') as t, m.function_id as fid, m.level as lv, substr(event_message, 1, 200) as msg
             from function_logs cross join unnest(metadata) as m where m.level in ('error', 'warning') order by timestamp desc limit 50" \
            | jq -r '.result[]? | "\(.t) \(.lv) \(.msg)"' | sed -E 's/[A-Za-z0-9_-]{30,}/***/g' | head -50
      - name: Kết nối database (Session pooler, IPv4)
        run: |
          export PGUSER="postgres.${SUPABASE_PROJECT_REF}" PGDATABASE=postgres PGPORT=5432
          for host in "aws-1-${SUPABASE_REGION}.pooler.supabase.com" "aws-0-${SUPABASE_REGION}.pooler.supabase.com"; do
            if PGHOST="$host" psql -tAc 'select 1' >/dev/null 2>&1; then
              { echo "PGHOST=$host"; echo "PGUSER=$PGUSER"; echo "PGDATABASE=postgres"; echo "PGPORT=5432"; } >> "$GITHUB_ENV"; exit 0
            fi
          done
          echo "Không kết nối được database"; exit 1
      - name: Số liệu ảnh đại diện / tệp (chỉ số đếm)
        run: |
          psql -P pager=off -c "
            select split_part(name, '/', 2) as thu_muc, count(*) as so_tep,
                   count(*) filter (where drive_id is not null) as tren_drive, count(*) filter (where drive_id is null) as kho_cu,
                   count(*) filter (where move_fail > 0) as chuyen_loi,
                   to_char(max(updated_at) at time zone 'Asia/Ho_Chi_Minh', 'DD/MM HH24:MI') as sua_cuoi,
                   count(*) filter (where updated_at > now() - interval '2 days') as sua_2_ngay
            from public.file_store group by 1 order by 2 desc"
          psql -P pager=off -c "
            select count(*) as nhan_vien,
                   count(*) filter (where exists (select 1 from public.file_store f where f.tenant_id = s.tenant_id
                                                  and f.name = s.tenant_id::text || '/anh_dai_dien/' || s.id::text || '.jpg')) as co_anh
            from public.staff_members s"
          psql -P pager=off -c "select count(*) as nha_xe_co_drive from public.tenant_drive"
          psql -P pager=off -c "select count(*) as anh_trong_kho_cu from storage.objects where bucket_id = 'giay-to' and name like '%/anh_dai_dien/%'"
      - name: Mỗi tài khoản thấy được bao nhiêu ảnh đại diện (theo quyền thật, chỉ in vai trò + số đếm)
        run: |
          psql -tA -F '|' -c "select u.id, coalesce(string_agg(distinct r.code, ','), '-') from public.app_users u
                               left join public.user_roles ur on ur.tenant_id = u.tenant_id and ur.user_id = u.id
                               left join public.roles r on r.tenant_id = ur.tenant_id and r.id = ur.role_id
                               where u.status = 'active' group by u.id" > users.txt
          echo "Tài khoản đang hoạt động: $(wc -l < users.txt)"
          while IFS='|' read -r uid roles; do
            n=$(psql -tA -c "begin" -c "set local role authenticated" \
                  -c "select set_config('request.jwt.claims', json_build_object('sub', '$uid', 'role', 'authenticated')::text, true)" \
                  -c "select 'N=' || count(*) from public.file_store where name like '%/anh_dai_dien/%'" -c "rollback" 2>&1 | grep -oE 'N=[0-9]+|ERROR.*' | head -1)
            echo "vai trò [$roles]: thấy $n ảnh đại diện"
          done < users.txt | sort | uniq -c
      - name: Đọc thử 1 ảnh đại diện trên Drive (chỉ in kết quả)
        run: |
          row=$(psql -tA -F '|' -c "
            select d.url, d.key, f.drive_id from public.file_store f join public.tenant_drive d on d.tenant_id = f.tenant_id
            where f.name like '%/anh_dai_dien/%' and f.drive_id is not null order by f.updated_at desc limit 1")
          [ -n "$row" ] || { echo "Không có ảnh đại diện nào trên Drive để thử"; exit 0; }
          IFS='|' read -r url key id <<< "$row"
          echo "::add-mask::$url"; echo "::add-mask::$key"; echo "::add-mask::$id"
          body=$(jq -cn --arg k "$key" --arg i "$id" '{action:"hs_get", id:$i, key:$k}')
          code=$(curl -sS -L -o out.json -w '%{http_code}' --max-time 120 -H 'Content-Type: text/plain;charset=utf-8' --data "$body" "$url" || echo "curl_loi")
          echo "HTTP: $code"
          jq -r '"ok: \(.ok) · mo_ta: \(.description // "-") · co_du_lieu: \((.data // "") | length > 0) · do_dai: \((.data // "") | length)"' out.json 2>/dev/null \
            || { echo "Không phải JSON. 300 ký tự đầu:"; head -c 300 out.json | tr -d '\n' | sed -E 's/[A-Za-z0-9_-]{25,}/***/g'; echo; }
      - name: Thử quyền lưu ảnh báo đổ dầu theo từng tài khoản có hồ sơ (giao dịch hủy, không ghi gì)
        run: |
          psql -P pager=off -c "select policyname, cmd from pg_policies where tablename = 'file_store' and policyname like '%bao_dau%' order by 1"
          psql -P pager=off -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          do $$
          declare s record; ok int := 0; bad int := 0; e text; pos text;
          begin
            for s in select st.id, st.user_id, st.tenant_id, st.position from public.staff_members st
                     join public.app_users u on u.id = st.user_id and u.tenant_id = st.tenant_id and u.status = 'active' loop
              perform set_config('request.jwt.claims', json_build_object('sub', s.user_id, 'role', 'authenticated')::text, true);
              perform set_config('role', 'authenticated', true);
              begin
                insert into public.file_store (tenant_id, name, mime, size_bytes, updated_at)
                values (s.tenant_id, s.tenant_id::text || '/bao_dau/' || s.id::text || '/chan_doan.jpg', 'image/jpeg', 1, now())
                on conflict (tenant_id, name) do update set mime = excluded.mime;
                ok := ok + 1;
              exception when others then bad := bad + 1; e := sqlerrm; pos := s.position;
              end;
              perform set_config('role', 'none', true);
            end loop;
            raise notice 'Lưu được: %, bị chặn: %, lỗi cuối: % (chức vụ %)', ok, bad, e, pos;
          end $$;
          rollback;
          SQL
