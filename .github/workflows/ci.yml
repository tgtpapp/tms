name: CI

on:
  push:
    paths-ignore: ['docs/**', '**.md']
  pull_request:

# Nhánh phụ: lần đẩy mới hủy lần cũ đang chạy (không tốn phút cho bản đã cũ). Nhánh main không hủy để không bỏ dở việc đưa lên.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read

# Phiên bản Supabase CLI cố định: không phải hỏi GitHub "bản mới nhất" (hay bị giới hạn lượt).
env:
  SUPABASE_CLI_VERSION: 3.2.0

# Tiết kiệm phút GitHub Actions: gộp mọi kiểm thử vào 1 máy (chỉ khởi động Supabase local 1 lần);
# kiểm thử database / Edge Function chỉ chạy khi có sửa trong supabase/; đưa lên Supabase chỉ khi có sửa supabase/.
jobs:
  test:
    name: Kiểm tra + kiểm thử (giao diện, database, Edge Function, trình duyệt)
    runs-on: ubuntu-latest
    outputs:
      sb: ${{ steps.chg.outputs.sb }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Xác định phần có thay đổi
        # So với lần CI thành công gần nhất trên main (không chỉ lần đẩy trước), để thay đổi database của lần bị lỗi / bị chặn không bị bỏ sót.
        id: chg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=""
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            base=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" -q '.workflow_runs[0].head_sha' 2>/dev/null || true)
          fi
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$base" HEAD)
          else
            files=ALL
          fi
          if [ "$files" = ALL ] || echo "$files" | grep -qE '^(supabase/|\.github/)'; then sb=true; else sb=false; fi
          echo "sb=$sb" >> "$GITHUB_OUTPUT"
          echo "So với: ${base:-không có} · có sửa supabase/: $sb"
      - name: Không để lộ khóa bí mật
        # Chỉ quét tệp trong kho (git grep), tìm đúng dạng khóa thật:
        # khóa bí mật Supabase, chuỗi kết nối Postgres có mật khẩu, JWT.
        run: |
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{10,}|postgres(ql)?://[^:/[:space:]]+:[^@[:space:]]+@|eyJhbGciOi[A-Za-z0-9_-]{20,}' -- . ':!.github/workflows/ci.yml' ; then
            echo "Phát hiện khóa bí mật trong kho code" && exit 1
          fi
          echo "Không có khóa bí mật"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Cài thư viện
        working-directory: web
        # Cài đúng phiên bản đã khóa trong package-lock.json (kiểm mã băm từng gói): không tự kéo bản mới vừa phát hành
        # (chống thư viện bị cài mã độc / bản phát hành lỗi). Nâng thư viện: sửa package.json rồi tạo lại package-lock.json.
        run: npm ci --no-audit --no-fund
      - name: Kiểm tra lỗ hổng bảo mật đã biết của thư viện (mức nghiêm trọng)
        working-directory: web
        run: npm audit --omit=dev --audit-level=critical
      - name: Typecheck + build
        working-directory: web
        run: npm run check
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: denoland/setup-deno@v2
        if: steps.chg.outputs.sb == 'true'
        with:
          deno-version: v2.x
          cache: true
      - name: Kiểm tra kiểu Edge Function
        if: steps.chg.outputs.sb == 'true'
        run: deno check supabase/functions/admin-users/index.ts supabase/functions/doc-reader/index.ts supabase/functions/zalo/index.ts supabase/functions/drive/index.ts supabase/functions/doc-writer/index.ts supabase/functions/app-install/index.ts supabase/functions/push/index.ts supabase/functions/support/index.ts supabase/functions/lenh/index.ts supabase/functions/tep/index.ts supabase/functions/youtube/index.ts supabase/functions/qr-login/index.ts supabase/tests/e2e/admin_users.e2e.ts
      - name: Danh mục giấy tờ ở giao diện và Edge Function phải giống hệt
        run: cmp supabase/functions/_shared/doc_types.ts web/src/lib/docTypes.ts
      - name: Kiểm thử AI đọc giấy tờ (fetch giả, không gọi AI thật)
        if: steps.chg.outputs.sb == 'true'
        run: deno test supabase/tests/unit/
      - name: Khởi động Supabase local (chạy toàn bộ migration từ đầu)
        run: .github/scripts/supabase-start.sh full
      - name: Chạy kiểm thử pgTAP (phân quyền, cách ly nhà xe)
        if: steps.chg.outputs.sb == 'true'
        run: supabase test db
      - name: Mô phỏng project thật (không tự cấp quyền service_role)
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB" -v ON_ERROR_STOP=1 -c "revoke all on all tables in schema public from service_role; revoke all on all sequences in schema public from service_role;"
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20261118150000_quyen_service_role.sql
      - name: Chạy Edge Function
        run: |
          nohup supabase functions serve > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/admin-users || true)
            [ "$code" = "200" ] && echo "Edge Function sẵn sàng" && exit 0
            sleep 2
          done
          cat functions.log; exit 1
      - name: Chạy kịch bản đầu-cuối (đăng nhập, tạo tài khoản)
        if: steps.chg.outputs.sb == 'true'
        run: |
          supabase status -o env > status.env
          set -a; . ./status.env; set +a
          deno run -A supabase/tests/e2e/admin_users.e2e.ts
      - name: Làm sạch database cho kiểm thử giao diện (kịch bản đầu-cuối đã tạo tài khoản)
        if: steps.chg.outputs.sb == 'true'
        run: |
          supabase db reset
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          psql "$DB" -v ON_ERROR_STOP=1 -c "revoke all on all tables in schema public from service_role; revoke all on all sequences in schema public from service_role;"
          psql "$DB" -v ON_ERROR_STOP=1 -f supabase/migrations/20261118150000_quyen_service_role.sql
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:54321/auth/v1/health || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "Auth chưa sẵn sàng sau khi làm sạch"; exit 1
      - name: Nhớ trình duyệt Playwright giữa các lần chạy
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package.json') }}
      - name: Cài trình duyệt
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build giao diện trỏ vào Supabase local
        working-directory: web
        run: |
          supabase status -o env > ../status.env
          set -a; . ../status.env; set +a
          VITE_APP_NAME=TMS VITE_APP_ENV=local VITE_TENANT_CODE=thinh-phat \
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          npx vite build --mode ci
      - name: Chạy kiểm thử giao diện
        working-directory: web
        run: npx playwright test
      - name: Ảnh chụp giao diện để soát bố cục
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anh-giao-dien
          path: web/test-results/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Log Edge Function khi lỗi
        if: failure()
        run: cat functions.log || true
      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  deploy:
    name: Đưa database + Edge Function lên Supabase (bản chạy thật)
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.sb == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Mã project + vùng Supabase (công khai). Đổi máy chủ: sửa 2 dòng này.
      SUPABASE_PROJECT_REF: vnqkmaauqygnckgtshus
      SUPABASE_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase --version
      - name: Kiểm tra khóa bí mật đã khai báo
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Thiếu secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "Thiếu secret SUPABASE_DB_PASSWORD"; exit 1; }
      - name: Kết nối project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Tìm cổng kết nối IPv4 (Session pooler) của vùng
        run: |
          PW=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"],safe=""))')
          for host in "aws-1-${SUPABASE_REGION}.pooler.supabase.com" "aws-0-${SUPABASE_REGION}.pooler.supabase.com"; do
            url="postgresql://postgres.${SUPABASE_PROJECT_REF}:${PW}@${host}:5432/postgres"
            if psql "$url" -tAc 'select 1' >/dev/null 2>&1; then
              echo "::add-mask::$url"
              echo "SUPABASE_DB_URL=$url" >> "$GITHUB_ENV"
              echo "Dùng cổng: $host"
              exit 0
            fi
          done
          echo "Không kết nối được database qua Session pooler"; exit 1
      - name: Đưa migration mới lên (chỉ thêm, không xóa dữ liệu)
        run: supabase db push --remote="$SUPABASE_DB_URL" --yes
      - name: Địa chỉ Edge Function gửi thông báo cho lịch chạy mỗi phút (theo project đang triển khai)
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -qc "select app.set_push_url('https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/push')"
      - name: Khóa AI đọc giấy tờ (nếu khai báo ở GitHub thì chép sang Supabase)
        env:
          AI_PROVIDERS: ${{ secrets.AI_PROVIDERS }}
        run: |
          if [ -n "$AI_PROVIDERS" ]; then
            if supabase secrets set "AI_PROVIDERS=$AI_PROVIDERS" --yes >/dev/null 2>/tmp/err; then echo "Đã chép AI_PROVIDERS từ GitHub sang Supabase"
            else echo "::warning::Không chép được AI_PROVIDERS sang Supabase: $(grep -v "^Target:" /tmp/err | tr "\n" " " | head -c 400)"; fi
          else
            echo "GitHub không có secret AI_PROVIDERS (bỏ qua)"
          fi
      - name: Khóa tìm kiếm YouTube (nếu khai báo ở GitHub thì chép sang Supabase)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            if supabase secrets set "YOUTUBE_API_KEY=$YOUTUBE_API_KEY" --yes >/dev/null 2>/tmp/err; then echo "Đã chép YOUTUBE_API_KEY sang Supabase"
            else echo "::warning::Không chép được YOUTUBE_API_KEY sang Supabase"; fi
          else
            echo "GitHub không có secret YOUTUBE_API_KEY (bỏ qua)"
          fi
      - name: Đưa Edge Function lên
        run: |
          supabase functions deploy admin-users --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy doc-reader --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy zalo --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy drive --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy doc-writer --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy app-install --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy push --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy support --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy qr-login --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy lenh --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy tep --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy youtube --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes

  web:
    # Giao diện chỉ lên Cloudflare Pages SAU KHI database + Edge Function đã cập nhật (tránh giao diện mới gọi cột / hàm chưa có).
    name: Đưa giao diện lên Cloudflare Pages (sau database)
    needs: [test, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency: deploy-web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Tên project Cloudflare Pages (công khai). Đổi tên miền / project: sửa dòng này.
      CF_PAGES_PROJECT: thinhphat
      # Mã tài khoản Cloudflare (công khai, thấy trên thanh địa chỉ dash.cloudflare.com/<mã>)
      CLOUDFLARE_ACCOUNT_ID: 3651ecbe15f9368534fdb005f612d46a
    steps:
      - name: Kiểm tra khóa Cloudflare
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Chưa có secret CLOUDFLARE_API_TOKEN: Cloudflare vẫn tự đưa giao diện lên như cũ"; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.cf.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Lấy cấu hình project Cloudflare (biến VITE_* nếu có)
        if: steps.cf.outputs.ok == 'true'
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          acc="$CLOUDFLARE_ACCOUNT_ID"
          api "https://api.cloudflare.com/client/v4/accounts/$acc/pages/projects/$CF_PAGES_PROJECT" > /tmp/p.json
          python3 - <<'PY'
          import json, os
          d = json.load(open('/tmp/p.json'))
          if not d.get('success'):
              raise SystemExit('Không đọc được project Cloudflare Pages "%s": %s' % (os.environ['CF_PAGES_PROJECT'], [e.get('message') for e in d.get('errors', [])]))
          ev = ((d['result'].get('deployment_configs') or {}).get('production') or {}).get('env_vars') or {}
          out = open(os.environ['GITHUB_ENV'], 'a')
          names = []
          for k, v in ev.items():
              if not k.startswith('VITE_') and k != 'NODE_VERSION':
                  continue
              if (v or {}).get('type') != 'plain_text' or v.get('value') is None:
                  raise SystemExit('Biến %s trên Cloudflare đang để dạng bí mật: biến VITE_* là công khai, đổi sang dạng chữ thường' % k)
              out.write('%s<<__EOF__\n%s\n__EOF__\n' % (k, v['value']))
              names.append(k)
          # cấu hình chính nằm ở web/.env.production; biến đặt trên Cloudflare (nếu có) được ưu tiên như khi Cloudflare tự dựng
          if 'VITE_SUPABASE_URL' not in names and 'VITE_SUPABASE_URL=' not in open('web/.env.production').read():
              raise SystemExit('Thiếu VITE_SUPABASE_URL (web/.env.production hoặc biến trên Cloudflare)')
          print('Biến lấy từ Cloudflare:', ', '.join(sorted(names)) or 'không có (dùng web/.env.production)')
          PY
      - name: Dựng giao diện
        if: steps.cf.outputs.ok == 'true'
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Đưa lên Cloudflare Pages
        if: steps.cf.outputs.ok == 'true'
        working-directory: web
        run: npx --yes wrangler@3 pages deploy dist --project-name "$CF_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Tắt Cloudflare tự đưa lên khi có thay đổi (từ nay chỉ đưa lên qua bước này)
        if: steps.cf.outputs.ok == 'true'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          acc, name, tok = os.environ['CLOUDFLARE_ACCOUNT_ID'], os.environ['CF_PAGES_PROJECT'], os.environ['CLOUDFLARE_API_TOKEN']
          url = 'https://api.cloudflare.com/client/v4/accounts/%s/pages/projects/%s' % (acc, name)
          def call(method, body=None):
              req = urllib.request.Request(url, method=method, data=json.dumps(body).encode() if body else None,
                                           headers={'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'})
              return json.load(urllib.request.urlopen(req))
          src = (call('GET')['result'].get('source') or {})
          cfg = src.get('config') or {}
          if not src:
              print('Project không nối GitHub: không cần tắt'); raise SystemExit
          if cfg.get('production_deployments_enabled') is False and cfg.get('preview_deployment_setting') == 'none':
              print('Đã tắt từ trước'); raise SystemExit
          cfg.update({'production_deployments_enabled': False, 'preview_deployment_setting': 'none'})
          r = call('PATCH', {'source': {'type': src.get('type'), 'config': cfg}})
          c = (r.get('result') or {}).get('source', {}).get('config', {})
          print('Tự đưa lên bản chính:', c.get('production_deployments_enabled'), '· bản xem trước:', c.get('preview_deployment_setting'))
          PY
