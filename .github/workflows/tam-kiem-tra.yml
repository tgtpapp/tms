name: tam-kiem-tra
on: workflow_dispatch
permissions:
  contents: read
jobs:
  k:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - run: |
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects/vnqkmaauqygnckgtshus/config/auth > /tmp/a.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/a.json'))
          keep = [k for k in d if any(s in k for s in ['disable_signup','password','rate_limit','autoconfirm','external_email_enabled','external_phone_enabled','refresh_token','sessions_','captcha','mfa','jwt_exp','site_url','uri_allow','smtp_host','security_'])]
          for k in sorted(keep):
              v = d[k]
              if 'secret' in k or 'key' in k or 'pass' in k and isinstance(v, str) and k not in ('password_required_characters',):
                  v = '(có)' if v else '(trống)'
              print('cfg', k, '=', v)
          PY
