name: Chẩn đoán (tạm) chuyến
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: vnqkmaauqygnckgtshus
      SUPABASE_REGION: ap-southeast-1
    steps:
      - name: Đo (chỉ đọc, chỉ số đếm)
        run: |
          export PGUSER="postgres.${SUPABASE_PROJECT_REF}" PGPASSWORD="$SUPABASE_DB_PASSWORD" PGDATABASE=postgres PGPORT=5432
          for host in "aws-1-${SUPABASE_REGION}.pooler.supabase.com" "aws-0-${SUPABASE_REGION}.pooler.supabase.com"; do
            if PGHOST="$host" psql -tAc 'select 1' >/dev/null 2>&1; then
              PGHOST="$host" psql -v ON_ERROR_STOP=1 <<'SQL'
          select service_date, count(*) chuyen from public.trips where status = 'mo' and service_date between date '2026-11-20' and date '2026-11-24' group by 1 order by 1;
          select min(service_date), max(service_date), count(*) from public.trips where status = 'mo' and service_date >= date '2026-11-21';
          select key, value from public.tenant_settings where key like 'chuyen.%';
          SQL
              exit 0
            fi
          done
          exit 1
