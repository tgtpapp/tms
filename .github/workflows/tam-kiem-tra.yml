name: tam-kiem-tra
on: workflow_dispatch
permissions:
  contents: read
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm view rollup time --json | python3 -c 'import json,sys;d=json.load(sys.stdin);ks=[k for k in d if k[0].isdigit()];ks.sort(key=lambda k:d[k]);print("ban", ks[-8:]);print("tg", [d[k] for k in ks[-8:]])'
          npm view rollup dist-tags --json
          for v in 4.68.8 4.68.7 4.68.6 4.67.0; do echo "tarball $v: $(curl -s -o /dev/null -w '%{http_code}' https://registry.npmjs.org/rollup/-/rollup-$v.tgz)"; done
