name: Chẩn đoán AI đọc giấy tờ
on:
  workflow_dispatch:
# Quyền tối thiểu cho mã GitHub của lần chạy (chỉ đọc kho code)
permissions:
  contents: read

jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Gọi thử Gemini bằng khóa thật (không in khóa)
        env:
          AI_PROVIDERS: ${{ secrets.AI_PROVIDERS }}
        run: deno run --allow-net --allow-env --allow-read scripts/chan_doan_ai.ts
