name: Sao lưu mỗi đêm
on:
  schedule:
    - cron: '0 18 * * *'   # 01:00 giờ Việt Nam
  workflow_dispatch:
concurrency: sao-luu-dem
jobs:
  sao-luu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      # Mã project + vùng Supabase (công khai). Đổi máy chủ: sửa 2 dòng này.
      SUPABASE_PROJECT_REF: vnqkmaauqygnckgtshus
      SUPABASE_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4
      - name: Kết nối database (Session pooler, IPv4)
        run: |
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "Thiếu secret SUPABASE_DB_PASSWORD"; exit 1; }
          export PGUSER="postgres.${SUPABASE_PROJECT_REF}" PGPASSWORD="$SUPABASE_DB_PASSWORD" PGDATABASE=postgres PGPORT=5432
          for host in "aws-1-${SUPABASE_REGION}.pooler.supabase.com" "aws-0-${SUPABASE_REGION}.pooler.supabase.com"; do
            if PGHOST="$host" psql -tAc 'select 1' >/dev/null 2>&1; then
              { echo "PGHOST=$host"; echo "PGUSER=$PGUSER"; echo "PGDATABASE=postgres"; echo "PGPORT=5432"; } >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "Không kết nối được database"; exit 1
      - name: Sao lưu từng nhà xe lên Google Drive của nhà xe
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pip install --quiet 'psycopg[binary]'
          python3 .github/scripts/sao_luu_dem.py
      - name: Sao chép toàn hệ thống sang Neon (dự phòng khi Supabase hỏng)
        if: always()
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "::warning::Chưa có secret NEON_DATABASE_URL: bỏ qua bản sao toàn hệ thống sang Neon"; exit 0
          fi
          echo "::add-mask::$NEON_DATABASE_URL"
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          pg_dump --version
          pg_dump -Fc --no-owner --no-privileges -n public -n app -f db.dump
          # Neon: vai trò, tiện ích và bảng tài khoản tối thiểu (chỉ mã, email, SĐT; không chép mật khẩu)
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role nologin; end if;
          end $$;
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists btree_gist with schema extensions;
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key, email text, phone text, created_at timestamptz);
          create or replace function auth.uid() returns uuid language sql stable as $f$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $f$;
          create or replace function auth.role() returns text language sql stable as $f$ select nullif(current_setting('request.jwt.claim.role', true), '') $f$;
          create or replace function auth.jwt() returns jsonb language sql stable as $f$ select coalesce(nullif(current_setting('request.jwt.claims', true), ''), '{}')::jsonb $f$;
          SQL
          psql -v ON_ERROR_STOP=1 -c "\copy (select id, email, phone, created_at from auth.users) to 'users.csv' csv"
          psql "$NEON_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "create temp table u (like auth.users)" -c "\copy u from 'users.csv' csv" \
            -c "insert into auth.users select * from u on conflict (id) do update set email = excluded.email, phone = excluded.phone"
          pg_restore --clean --if-exists --no-owner --no-privileges -d "$NEON_DATABASE_URL" db.dump > restore.log 2>&1 || true
          echo "Số lỗi bỏ qua khi chép (tiện ích chỉ có ở Supabase như pg_cron): $(grep -c 'error:' restore.log || true)"
          # Đối chiếu số dòng các bảng chính
          bad=0
          for t in tenants app_users staff_members vehicles trips bookings seat_inventory ledger_transactions ledger_lines shipments documents; do
            a=$(psql -tAc "select count(*) from public.$t"); b=$(psql "$NEON_DATABASE_URL" -tAc "select count(*) from public.$t" 2>/dev/null || echo "?")
            echo "$t: Supabase $a · Neon $b"; [ "$a" = "$b" ] || bad=1
          done
          rm -f db.dump users.csv
          [ $bad = 0 ] || { echo "::error::Bản sao Neon lệch số dòng"; grep 'error:' restore.log | sed -E 's/(DETAIL|LINE).*//' | head -20; exit 1; }
