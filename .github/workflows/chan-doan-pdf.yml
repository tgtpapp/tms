name: Chẩn đoán (tạm) PDF
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: vnqkmaauqygnckgtshus
      SUPABASE_REGION: ap-southeast-1
    steps:
      - uses: supabase/setup-cli@v1
      - name: Đo cấu trúc ảnh trong PDF (không in nội dung)
        run: |
          export PGUSER="postgres.${SUPABASE_PROJECT_REF}" PGPASSWORD="$SUPABASE_DB_PASSWORD" PGDATABASE=postgres PGPORT=5432
          for host in "aws-1-${SUPABASE_REGION}.pooler.supabase.com" "aws-0-${SUPABASE_REGION}.pooler.supabase.com"; do
            PGHOST="$host" psql -tAc 'select 1' >/dev/null 2>&1 && export PGHOST="$host" && break
          done
          pip install --quiet pillow
          KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json | python3 -c 'import json,sys; print([k["api_key"] for k in json.load(sys.stdin) if k["name"]=="service_role"][0])')
          echo "::add-mask::$KEY"
          psql -tAc "select f from public.staff_records r, unnest(r.files) f where r.kind = 'suc_khoe' and f ilike '%.pdf' limit 2" > files.txt
          n=0
          while read -r f; do
            [ -z "$f" ] && continue; n=$((n+1))
            curl -sS -o "f$n.pdf" -H "Authorization: Bearer $KEY" -H "apikey: $KEY" "https://${SUPABASE_PROJECT_REF}.supabase.co/storage/v1/object/giay-to/$f"
            python3 - "f$n.pdf" <<'PY'
          import re, sys, io
          from PIL import Image
          b = open(sys.argv[1], 'rb').read(); t = b.decode('latin1'); ok = bad = skip = 0
          for m in re.finditer(r'/Subtype\s*/Image', t):
              s = t.rfind('obj', 0, m.start()); e = t.find('stream', m.start()); d = t[s:e]
              w = int(re.search(r'/Width\s+(\d+)', d).group(1)); h = int(re.search(r'/Height\s+(\d+)', d).group(1))
              if w / h >= 4 or (w < 120 and h < 120): skip += 1; continue
              p = e + 6
              if t[p] == '\r': p += 1
              if t[p] == '\n': p += 1
              lm = re.search(r'/Length\s+(\d+)(\s+\d+\s+R)?', d); ln = int(lm.group(1)) if lm and not lm.group(2) else 0
              end = t.find('endstream', p); data = b[p:p + ln] if ln else b[p:end]
              k = len(data)
              while k > 2 and data[k - 1] != 0xd9: k -= 1
              try:
                  im = Image.open(io.BytesIO(data[:k])); im.load(); ok += 1
              except Exception as x: bad += 1
          print(f'Ảnh trang đọc được {ok}, hỏng {bad}, bỏ dải quảng cáo {skip}')
          PY
          done < files.txt
          rm -f f*.pdf files.txt
